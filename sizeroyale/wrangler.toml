name = "sizeroyale"
main = "worker.js"
compatibility_date = "2026-11-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
SITE_URL = "https://sizeroyale.fun"
ROUND_SEC = "20"
REVEAL_SEC = "6"

# Cloudflare's PR preview build runs `wrangler preview` and requires
# preview-scoped values for every variable. Keep preview canonicals on the
# existing workers.dev hostname; production continues to use the custom domain.
[previews.vars]
SITE_URL = "https://sizeroyale.fazedanish5.workers.dev"
ROUND_SEC = "20"
REVEAL_SEC = "6"
